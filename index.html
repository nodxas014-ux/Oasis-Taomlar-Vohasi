<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taomlar Vohasi 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; UI floats on lapis-glass panels at the four corners, view strip along the bottom. */
:root{
  --ink:#f3ecdd;          /* ganch ivory */
  --ink-dim:#b9b3a6;
  --glass:rgba(13,20,34,.74);
  --glass-hi:rgba(22,33,54,.86);
  --line:rgba(243,236,221,.14);
  --turq:#3cb7ae;         /* majolica turquoise */
  --gold:#d2ad66;         /* bronze gold */
  --lapis:#1c3a6b;
  --f-display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --gut-t:calc(14px + env(safe-area-inset-top, 0px));
  --gut-b:calc(14px + env(safe-area-inset-bottom, 0px));
  color-scheme:dark;
}
html,body{height:100%;}
body{background:#0b111d;color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;}

.ui{position:fixed;inset:0;pointer-events:none;padding-left:var(--gut-l);padding-right:var(--gut-r);}
.ui > *{pointer-events:auto;}
.panel{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:14px;}

.brand{position:absolute;top:var(--gut-t);left:var(--gut-l);padding:12px 16px 12px 14px;display:flex;gap:12px;align-items:center;}
.brand svg{flex:none}
.brand .mark{font-family:var(--f-display);font-size:24px;letter-spacing:.32em;line-height:1;color:var(--ink);}
.brand .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px;}
.brand .sub b{color:var(--gold);font-weight:500;}

.tools{position:absolute;top:var(--gut-t);right:var(--gut-r);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:min(520px,60vw);}
.btn{font:500 13px/1 var(--f-ui);letter-spacing:.04em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .2s,border-color .2s,color .2s;}
.btn:hover{background:var(--glass-hi);}
.btn[aria-pressed="true"]{border-color:var(--turq);color:#dff7f4;background:rgba(28,96,96,.55);}
.btn:focus-visible,.chip:focus-visible,.legend li button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.seg{display:flex;border-radius:999px;overflow:hidden;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.seg .btn{border:0;border-radius:0;background:transparent;backdrop-filter:none;}
.seg .btn[aria-pressed="true"]{background:rgba(28,96,96,.6);}

.legend{position:absolute;top:calc(var(--gut-t) + 78px);left:var(--gut-l);width:270px;max-height:calc(100% - var(--gut-t) - var(--gut-b) - 250px);display:flex;flex-direction:column;overflow:hidden;}
.legend h2{font:500 11px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin:0;padding:14px 16px 10px;display:flex;justify-content:space-between;}
.legend h2 span{font-family:var(--f-mono);letter-spacing:0;color:var(--gold);}
.legend ol{list-style:none;margin:0;padding:0 6px 8px;overflow-y:auto;}
.legend li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;cursor:pointer;}
.legend li button:hover,.legend li button[aria-current="true"]{background:rgba(60,183,174,.14);}
.legend .n{font-family:var(--f-mono);font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;}
.legend .t{font-size:14px;line-height:1.25;}
.legend .t small{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px;}
.legend-toggle{all:unset;cursor:pointer;display:flex;gap:14px;justify-content:space-between;padding:13px 16px;font:500 11px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);}
.legend-toggle span{font-family:var(--f-mono);letter-spacing:0;color:var(--gold);}
.legend.closed ol{display:none;}
.legend h2{display:none;}

.card{position:absolute;left:var(--gut-l);bottom:calc(var(--gut-b) + 64px);width:min(380px, calc(100% - var(--gut-l) - var(--gut-r)));padding:16px 18px 16px;}
.card .k{font:500 11px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--turq);}
.card h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:8px 0 2px;text-wrap:balance;}
.card .s{color:var(--ink-dim);font-size:13px;}
.card .d{font-family:var(--f-mono);font-size:12.5px;color:var(--gold);margin:10px 0 8px;font-variant-numeric:tabular-nums;line-height:1.5;}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink);max-width:62ch;}
.card .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;font-size:16px;line-height:1;}

.views{position:absolute;left:0;right:0;bottom:var(--gut-b);display:flex;gap:8px;justify-content:center;padding:0 var(--gut-r) 0 var(--gut-l);overflow-x:auto;scrollbar-width:none;}
.views::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px/1 var(--f-ui);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:11px 15px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;}
.chip[aria-current="true"]{border-color:var(--gold);color:#fff3da;background:rgba(120,88,40,.55);}

.note{position:absolute;right:var(--gut-r);bottom:calc(var(--gut-b) + 64px);max-width:300px;font-size:11.5px;line-height:1.45;color:var(--ink-dim);padding:10px 12px;}
.note b{color:var(--ink);font-weight:500;}

#pins{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;transform:translate(-50%,-50%);cursor:pointer;white-space:nowrap;border:0;background:none;padding:0;color:var(--ink);font:inherit;}
.pin i{font-style:normal;display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:rgba(12,22,40,.88);border:1.5px solid var(--gold);font:500 12px/1 var(--f-mono);color:#ffe6b3;box-shadow:0 2px 10px rgba(0,0,0,.35);}
.pin span{font-size:12.5px;padding:4px 8px;border-radius:8px;background:rgba(12,22,40,.72);opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s;}
.pin:hover span,.pin.on span,.showNames .pin span{opacity:1;transform:none;}
.pin.on i{background:var(--turq);color:#06201f;border-color:#bff3ee;}
.pins-off .pin{display:none;}

#loader{position:fixed;inset:0;display:grid;place-items:center;background:#0b111d;z-index:5;transition:opacity .6s;}
#loader div{text-align:center;}
#loader .m{font-family:var(--f-display);font-size:34px;letter-spacing:.4em;padding-left:.4em;}
#loader .l{margin-top:12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);}
#loader.done{opacity:0;pointer-events:none;}

@media (max-width:760px){
  .brand{padding:9px 12px;gap:10px}
  .brand .mark{font-size:18px}
  .brand .sub{font-size:10.5px;letter-spacing:.1em}
  .brand svg{width:26px;height:26px}
  .tools{top:calc(var(--gut-t) + 62px);right:var(--gut-r);left:var(--gut-l);max-width:none;justify-content:flex-start;}
  .btn{padding:8px 10px;font-size:12px}
  .tools{gap:6px;flex-wrap:nowrap;}
  .legend{top:auto;bottom:calc(var(--gut-b) + 58px);width:auto;right:var(--gut-r);max-height:52%;}
  .legend.closed{right:auto;}
  .card{bottom:calc(var(--gut-b) + 112px);}
  .note{display:none;}
  .views{justify-content:flex-start;}
}
@media (prefers-reduced-motion:reduce){ .pin span,.btn,#loader{transition:none} }
</style>
</head>
<body>

<div id="stage"></div>
<div id="pins"></div>

<div class="ui">
  <header class="brand panel">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><g fill="none" stroke="#d2ad66" stroke-width="1.4"><rect x="7" y="7" width="20" height="20"/><rect x="7" y="7" width="20" height="20" transform="rotate(45 17 17)"/><circle cx="17" cy="17" r="4.2" stroke="#3cb7ae"/></g></svg>
    <div>
      <div class="mark">OASIS</div>
      <div class="sub">Taomlar Vohasi · <b>3D konsepsiya</b></div>
    </div>
  </header>

  <div class="tools">
    <div class="seg" role="group" aria-label="Kun vaqti">
      <button class="btn" id="btnDay" aria-pressed="true">Kunduz</button>
      <button class="btn" id="btnNight" aria-pressed="false">Kechqurun</button>
    </div>
    <button class="btn" id="btnPins" aria-pressed="true">Raqamlar</button>
    <button class="btn" id="btnSpin" aria-pressed="false">Aylantirish</button>
  </div>

  <aside class="legend panel" id="legend">
    <button class="legend-toggle" id="legendToggle" aria-expanded="true">Bosh reja · 1–14 <span>≈ 900 m²</span></button>
    <h2>Bosh reja <span>≈ 900 m²</span></h2>
    <ol id="legendList"></ol>
  </aside>

  <section class="card panel" id="card" hidden aria-live="polite">
    <button class="x" id="cardClose" aria-label="Yopish">×</button>
    <div class="k" id="cardK"></div>
    <h3 id="cardH"></h3>
    <div class="s" id="cardS"></div>
    <div class="d" id="cardD"></div>
    <p id="cardP"></p>
  </section>

  <div class="note panel"><b>Konsept-vizualizatsiya.</b> Binolar o‘lchamlari qo‘lda chizilgan eskizlardan olingan; uchastkadagi joylashuv sxemadan taxminiy masshtabda (±0.5–1 m).</div>

  <nav class="views" id="views" aria-label="Ko‘rinishlar"></nav>
</div>

<div id="loader"><div><div class="m">OASIS</div><div class="l">3D model yuklanmoqda…</div></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const DEG = Math.PI/180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(20261101);
const pick = arr => arr[Math.floor(rnd()*arr.length)];

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, stage.clientWidth/stage.clientHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 0.495*Math.PI; controls.minDistance = 1.2; controls.maxDistance = 150;
controls.autoRotateSpeed = 0.6;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* ---------------- procedural textures ---------------- */
function canvasTex(size, draw, {srgb=true, clamp=false}={}){
  const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d'); draw(g,size);
  const t=new THREE.CanvasTexture(c);
  if(!clamp){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  t.colorSpace = srgb? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8; return t;
}
function speckle(g,S,n,cols,a=.06,r=1.4){ for(let i=0;i<n;i++){ g.globalAlpha=a*rnd(); g.fillStyle=pick(cols); g.beginPath(); g.arc(rnd()*S,rnd()*S,rnd()*r+.3,0,7); g.fill(); } g.globalAlpha=1; }
function starPath(g,cx,cy,R,r,k,rot){ g.beginPath(); for(let i=0;i<k*2;i++){const a=rot+i*Math.PI/k; const rr=i%2?r:R; g.lineTo(cx+rr*Math.cos(a), cy+rr*Math.sin(a));} g.closePath(); }
function drawGirih(g,S,n,p){
  const s=S/n; g.fillStyle=p.bg; g.fillRect(0,0,S,S);
  for(let i=0;i<=n;i++)for(let j=0;j<=n;j++){ starPath(g,i*s,j*s,s*.34,s*.12,4,Math.PI/4); g.fillStyle=p.cross; g.fill(); }
  g.lineJoin='round';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const cx=(i+.5)*s, cy=(j+.5)*s;
    starPath(g,cx,cy,s*.47,s*.36,8,0); g.fillStyle=p.star; g.fill(); g.lineWidth=s*.035; g.strokeStyle=p.edge; g.stroke();
    g.beginPath(); for(let k=0;k<8;k++){const a=Math.PI/8+k*Math.PI/4; g.lineTo(cx+s*.25*Math.cos(a), cy+s*.25*Math.sin(a));} g.closePath(); g.fillStyle=p.oct; g.fill(); g.stroke();
    starPath(g,cx,cy,s*.16,s*.075,8,Math.PI/8); g.fillStyle=p.center; g.fill();
  }
}
const T = {};
T.girih = canvasTex(1024,(g,S)=>{ drawGirih(g,S,4,{bg:'#efe6d2',cross:'#1d3c70',star:'#1f8f8a',edge:'#f6efe0',oct:'#173563',center:'#d9b25e'}); speckle(g,S,900,['#fff','#000'],.05); });
T.girihDoor = canvasTex(512,(g,S)=>{ drawGirih(g,S,3,{bg:'#3a2a1a',cross:'#6b4f2c',star:'#8c6a3c',edge:'#c9a15c',oct:'#4a3520',center:'#d8b46a'}); });
T.screen = canvasTex(512,(g,S)=>{ g.fillStyle='#fff'; g.fillRect(0,0,S,S); const n=3,s=S/n;
  for(let i=0;i<=n;i++)for(let j=0;j<=n;j++){ starPath(g,i*s,j*s,s*.2,s*.08,4,Math.PI/4); g.fillStyle='#000'; g.fill(); }
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const cx=(i+.5)*s,cy=(j+.5)*s; starPath(g,cx,cy,s*.42,s*.32,8,0); g.fillStyle='#000'; g.fill(); starPath(g,cx,cy,s*.2,s*.15,8,Math.PI/8); g.fillStyle='#fff'; g.fill(); }
},{srgb:false});
T.brick = canvasTex(1024,(g,S)=>{ g.fillStyle='#d6c3a2'; g.fillRect(0,0,S,S);
  const cols=['#b8683f','#a95d38','#c27548','#9e5333','#b36a44','#c4804f','#a4583a']; const rows=13, bw=S/4, rh=S/rows, j=S*.0045;
  for(let r=0;r<rows;r++){ const header=r%4===3; const w=header?bw/2:bw; const off=header?bw/4:(r%2?bw/2:0);
    for(let x=-2*bw;x<S+bw;x+=w){ g.fillStyle=pick(cols); g.fillRect(x+off+j, r*rh+j, w-2*j, rh-2*j); } }
  speckle(g,S,4000,['#5a2c18','#f0d2b0'],.12,1.2); });
T.stone = canvasTex(1024,(g,S)=>{ g.fillStyle='#e9dfca'; g.fillRect(0,0,S,S);
  const cw=S/2, rh=S/4; for(let r=0;r<4;r++){ const off=r%2?cw/2:0; for(let x=-cw;x<S+cw;x+=cw){ const l=79+rnd()*6; g.fillStyle=`hsl(36,28%,${l}%)`; g.fillRect(x+off+2,r*rh+2,cw-4,rh-4);} }
  speckle(g,S,6000,['#b9a786','#fff8ea','#cbb995'],.18,1.6); });
T.pave = canvasTex(1024,(g,S)=>{ g.fillStyle='#bfae8f'; g.fillRect(0,0,S,S); const n=4,s=S/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const l=73+rnd()*7; g.fillStyle=`hsl(36,${22+rnd()*8}%,${l}%)`; g.fillRect(i*s+3,j*s+3,s-6,s-6);
    for(let k=0;k<14;k++){ g.globalAlpha=.25; g.fillStyle='#a8977a'; g.fillRect(i*s+3+rnd()*(s-40), j*s+3+rnd()*(s-8), 10+rnd()*30, 1.5); } g.globalAlpha=1; }
  speckle(g,S,5000,['#9a8a6e','#f5ecdc'],.2,1.3); });
T.basalt = canvasTex(512,(g,S)=>{ g.fillStyle='#4a4641'; g.fillRect(0,0,S,S); const n=2,s=S/n; for(let i=0;i<n;i++)for(let j=0;j<n;j++){ g.fillStyle=`hsl(30,6%,${28+rnd()*4}%)`; g.fillRect(i*s+2,j*s+2,s-4,s-4);} speckle(g,S,3000,['#777','#222'],.25,1.2); });
T.lawn = canvasTex(512,(g,S)=>{ g.fillStyle='#5d7d36'; g.fillRect(0,0,S,S); for(let i=0;i<9000;i++){ g.strokeStyle=pick(['#4f6d2c','#6c8c40','#56782f','#7a9a4a','#48652a']); g.globalAlpha=.5; g.beginPath(); const x=rnd()*S,y=rnd()*S; g.moveTo(x,y); g.lineTo(x+rnd()*3-1.5,y-3-rnd()*4); g.stroke(); } g.globalAlpha=1; });
T.wood = canvasTex(512,(g,S)=>{ const n=10,s=S/n; for(let i=0;i<n;i++){ g.fillStyle=`hsl(26,${38+rnd()*8}%,${26+rnd()*6}%)`; g.fillRect(i*s,0,s,S); for(let k=0;k<10;k++){ g.strokeStyle='rgba(30,15,5,.25)'; g.beginPath(); const x=i*s+rnd()*s; g.moveTo(x,0); g.bezierCurveTo(x+rnd()*6-3,S*.3,x+rnd()*6-3,S*.7,x,S); g.stroke(); } g.fillStyle='rgba(10,5,0,.75)'; g.fillRect(i*s+s-4,0,4,S);} });
T.plaza = canvasTex(1024,(g,S)=>{ const c=S/2, R=S/2;
  g.fillStyle='#dccdb0'; g.fillRect(0,0,S,S);
  for(let k=0;k<32;k++){ const a0=k*Math.PI/16, a1=a0+Math.PI/16; g.beginPath(); g.arc(c,c,R*.72,a0,a1); g.arc(c,c,R*.36,a1,a0,true); g.closePath(); g.fillStyle=k%2?'#d3c2a3':'#e3d6bc'; g.fill(); }
  const ring=(r,w,col)=>{ g.beginPath(); g.arc(c,c,r*R,0,7); g.lineWidth=w*R; g.strokeStyle=col; g.stroke(); };
  ring(.33,.05,'#5a544c'); ring(.72,.012,'#5a544c'); ring(.97,.04,'#5a544c'); ring(.89,.006,'#8a7f70');
  for(let k=0;k<16;k++){ const a=k*Math.PI/8+Math.PI/16; starPath(g,c+Math.cos(a)*R*.805,c+Math.sin(a)*R*.805,R*.055,R*.04,8,0); g.fillStyle='#5a544c'; g.fill(); starPath(g,c+Math.cos(a)*R*.805,c+Math.sin(a)*R*.805,R*.022,R*.011,8,0); g.fillStyle='#2b8f88'; g.fill(); }
  speckle(g,S,8000,['#9a8a6e','#f5ecdc'],.18,1.4);
},{clamp:true});
T.waterN = (()=>{ const N=256, c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d'); const im=g.createImageData(N,N);

function bake(){
  scene.updateMatrixWorld(true); const buckets=new Map(), victims=[];
  scene.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||Array.isArray(o.material)||o.userData.noBake) return; let p=o.parent; while(p){ if(p.userData.noBake) return; p=p.parent; }
    const m=o.material; if(m.isShaderMaterial) return; const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    for(const k of Object.keys(g.attributes)) if(!['position','normal','uv'].includes(k)) g.deleteAttribute(k); if(!g.attributes.uv) return; g.clearGroups();
    if(!buckets.has(m)) buckets.set(m,[]); buckets.get(m).push(g); victims.push(o); });
  for(const o of victims){ o.parent.remove(o); }
  for(const [m,gs] of buckets){ const mesh=new THREE.Mesh(mergeGeometries(gs),m); scene.add(mesh); }
}

  const li=document.createElement('li'); const b=document.createElement('button'); b.innerHTML=`<span class="n">${it.id}</span><span class="t">${it.name}<small>${it.kind}</small></span>`; b.onclick=()=>select(it,true); li.appendChild(b); list.appendChild(li); it.li=b;
  const p=document.createElement('button'); p.className='pin'; p.innerHTML=`<i>${it.id}</i><span>${it.name}</span>`; p.setAttribute('aria-label',`${it.id} — ${it.name}`); p.onclick=()=>select(it,true); pinLayer.appendChild(p); it.el=p;
});
let selected=null; const card=document.getElementById('card');
function select(it,go){ selected=it; ALL.forEach(x=>{ x.el.classList.toggle('on',x===it); x.li.setAttribute('aria-current',String(x===it)); });
  if(!it){ card.hidden=true; return; }
  document.getElementById('cardK').textContent=`${it.id} · ${it.kind}`; document.getElementById('cardH').textContent=it.name; document.getElementById('cardS').textContent=it.sub; document.getElementById('cardD').textContent=it.dims; document.getElementById('cardP').textContent=it.note; card.hidden=false;
  if(go){ const dir=new THREE.Vector3().subVectors(camera.position,controls.target).setY(0); if(dir.lengthSq()<1) dir.set(0,0,1); dir.normalize();
    const dist=it.id==='8'?17:it.id==='2–4'?16:11; const t=it.pos.clone(); t.y=Math.max(1.2,t.y-2.8);
    VIEWS.__sel={p:t.clone().addScaledVector(dir,dist).setY(t.y+dist*0.55),t}; fly('__sel'); setCurrentView(null);
    if(innerWidth<1100||innerHeight<760){ legend.classList.add('closed'); lt.setAttribute('aria-expanded','false'); } } }
document.getElementById('cardClose').onclick=()=>select(null);
document.getElementById('btnDay').onclick=()=>setNight(false);
document.getElementById('btnNight').onclick=()=>setNight(true);
document.getElementById('btnPins').onclick=e=>{ const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',String(on)); pinLayer.classList.toggle('pins-off',!on); };
document.getElementById('btnSpin').onclick=e=>{ const on=!controls.autoRotate; controls.autoRotate=on; e.currentTarget.setAttribute('aria-pressed',String(on)); };
const legend=document.getElementById('legend'), lt=document.getElementById('legendToggle');
if(innerWidth<1100||innerHeight<760){ legend.classList.add('closed'); lt.setAttribute('aria-expanded','false'); }
lt.onclick=()=>{ const c=legend.classList.toggle('closed'); lt.setAttribute('aria-expanded',String(!c)); };
function fromHash(instant){ const k=decodeURIComponent(location.hash.slice(1)); if(VIEWS[k]) fly(k,instant); else fly('umumiy',instant); }
addEventListener('hashchange',()=>fromHash(false));

/* ---------------- loop ---------------- */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); composer.setSize(w,h); camera.aspect=w/h; camera.fov=camera.aspect<0.8?60:42; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const tmp=new THREE.Vector3();
function updatePins(){ const w=stage.clientWidth,h=stage.clientHeight;
  for(const it of ALL){ tmp.copy(it.pos).project(camera); const vis=tmp.z<1 && Math.abs(tmp.x)<1.1 && Math.abs(tmp.y)<1.1; it.el.style.visibility=vis?'visible':'hidden';
    if(vis) it.el.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-13px,-50%)`; } }
const clock=new THREE.Clock();
function frame(now){ requestAnimationFrame(frame); if(document.hidden) return; const t=clock.getElapsedTime();
  stepTween(now); controls.update();
  T.waterN.offset.set(t*0.02,t*0.013);
  if(window.__jets && !reduceMotion){ const s=1+Math.sin(t*3.1)*0.03; window.__jets.scale.set(1,s,1); M.jet.opacity=0.45+Math.sin(t*5.3)*0.06; }
  if(night && window.__fire) window.__fire.intensity=18*(0.8+0.25*Math.sin(t*13)+0.15*Math.sin(t*7.3));
  if(night) composer.render(); else renderer.render(scene,camera);
  updatePins(); }
setNight(false);
fromHash(true);
requestAnimationFrame(frame);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('loader').classList.add('done')));
window.__ready=true; window.__fly=fly; window.__setNight=setNight;
</script>
</body>
</html>
